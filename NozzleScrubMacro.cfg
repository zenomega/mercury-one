[gcode_macro CLEAN_NOZZLE]
variable_start_x: 257      ; X coordinate of the brush center
variable_start_y: 60      ; Y coordinate of the brush center
variable_clearance_z: 10    ; Z-axis lift before scrubbing
variable_wipe_distance: 3 ; Distance the X-axis wipes back and forth
variable_wipe_qty: 6       ; Number of full wipe cycles
variable_wipe_spd_xy: 9000 ; Wipe speed in mm/min (keep below 10,000 for sensorless)

gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    
    SAVE_GCODE_STATE NAME=clean_state
    G90
    
    # 1. Raise Z to safe travel height and move above the brush
    G1 Z{clearance_z} F1500
    G1 X{start_x} Y{start_y} F18000
    
    # 2. Scrub back and forth
    G91 ; relative positioning
    {% for wipes in range(1, (wipe_qty + 1)) %}
        G1 X{wipe_distance} F{wipe_spd_xy}
        G1 X-{wipe_distance} F{wipe_spd_xy}
    {% endfor %}
    
    # 3. Slow Y-axis incremental step to clear any stubborn blobs (Sensorless safety)
    G1 Y-25 F300
    G1 Y5 F300
    
    RESTORE_GCODE_STATE NAME=clean_state
