# bltouch z settings motherboard these work fine
# [bltouch]
# sensor_pin: ^PC14
# control_pin: PA1
# x_offset: -15 #WAS -42.5
# y_offset: 5 #WAS -10
# z_offset: 0.0 
# probe_with_touch_mode: True
# pin_up_touch_mode_reports_triggered: True
# pin_up_touch_mode_reports_triggered: False #uncomment if using a clone
# stow_on_each_sample = False

[exclude_object]

[extruder]
step_pin: EBBCan: PD0
dir_pin: EBBCan: PD1 # needs to be reversed for sherpa mini
enable_pin: !EBBCan: PD2
microsteps: 16
rotation_distance: 5.7 #FOR LGX LITE
#gear_ratio: 50:10
#rotation_distance: 22 #was 22
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan: PB13
sensor_type: EPCOS 100K B57560G104F
sensor_pin: EBBCan: PA3
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
pressure_advance: 0.02
pressure_advance_smooth_time: 0.04
min_temp: 0
max_temp: 285

[tmc2209 extruder]
uart_pin: EBBCan: PA15
sense_resistor: 0.110
run_current: 0.5 # for lgx lite
#run_current: 0.6 # sherpa mini
hold_current: 0.40
stealthchop_threshold: 0
interpolate: false

[temperature_sensor EBBCan]
sensor_type: temperature_mcu
sensor_mcu: EBBCan
min_temp: 0
max_temp: 100

[resonance_tester]
accel_chip: adxl345
probe_points:
    142.5, 142.5, 20  # Center for merc1

[adxl345]
cs_pin: EBBCan: PB12
spi_bus: spi2_PB2_PB11_PB10
axes_map: x,y,z

[verify_heater extruder]
max_error: 170
check_gain_time: 9999
hysteresis: 5

[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
#control: pid
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: 0
max_temp: 130

[fan]
pin: EBBCan: PA0

[heater_fan hotend_fan]
pin: EBBCan: PA1
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0

[fan]
pin: EBBCan:PA0            # Triggers your part cooling fan
kick_start_time: 0.5
off_below: 0.10

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>

